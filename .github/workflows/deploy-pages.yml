name: Deploy HQT Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hqt-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hqt-website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hqt-website

      - name: Type check and build
        env:
          # Project site is served from https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
        working-directory: hqt-website

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: hqt-website

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hqt-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires GitHub Pages to be enabled once in the repository settings
      # (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).
      # The GITHUB_TOKEN cannot create the Pages site itself.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
