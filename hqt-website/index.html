<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HQT Group | Import · Export · Cold-Chain Logistics</title>
    <meta
      name="description"
      content="HQT Group imports frozen seafood, meat and poultry from India, Russia and partner markets, exports Vietnamese goods and runs cold-chain logistics across Vietnam."
    />
    <meta name="author" content="%COMPANY_NAME%" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b1f3a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#071427" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%COMPANY_NAME%" />
    <meta property="og:title" content="HQT Group | Import · Export · Cold-Chain Logistics" />
    <meta
      property="og:description"
      content="Reliable, compliant, temperature-controlled supply chain for frozen seafood, meat and poultry. Multi-origin sourcing, customs expertise and flexible order sizes for distributors."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="vi_VN" />

    <!-- Twitter -->
    <meta name="twitter:title" content="HQT Group | Import · Export · Cold-Chain Logistics" />
    <meta
      name="twitter:description"
      content="Reliable, compliant, temperature-controlled supply chain for frozen seafood, meat and poultry."
    />

    <!-- Filled in at build time from src/content/company.ts (see vite.config.ts) -->
    %SEO_TAGS%
  </head>
  <body class="bg-white text-navy-900 antialiased dark:bg-navy-950 dark:text-navy-50">
    %NOSCRIPT%
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
